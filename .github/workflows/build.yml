name: Build

on:
  workflow_dispatch: 
  push:
    branches: [master]
    paths:
      - "**.sp"
      - "**.inc"
      - "**.yml"
    tags:
        - v*
  pull_request:
    branches: [master]
    paths:
      - "**.sp"
      - "**.inc"
      - "**.yml"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download SourceMod
        run: |
          wget -q "http://www.sourcemod.net/latest.php?version=1.12&os=linux" -O sourcemod.tar.gz
          tar -xf sourcemod.tar.gz

      - name: Download external includes
        working-directory: ./addons/sourcemod/scripting/include
        run: |
          wget -O vphysics.inc https://github.com/Alienmario/vphysics/raw/patch-1/vphysics.inc
          wget -O steamtools.inc https://github.com/asherkin/SteamTools/raw/master/plugin/steamtools.inc

      - name: Compile
        working-directory: ./addons/sourcemod/scripting
        run: |
          ./spcomp64 starfortress64.sp -o starfortress64.smx
          ./spcomp64 starfortress64-deathmatch.sp -o starfortress64-deathmatch.smx
          
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
              ./addons/sourcemod/scripting/starfortress64.smx
              ./addons/sourcemod/scripting/starfortress64-deathmatch.smx
              ./addons/sourcemod/scripting/include/starfortress64.inc
              ./addons/sourcemod/gamedata/starfortress64.txt
